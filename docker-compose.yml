services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music}
      POSTGRES_DB: music
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: [.env]
    environment: &appenv
      DATABASE_URL: postgresql+psycopg2://music:${POSTGRES_PASSWORD:-music}@db:5432/music
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build: .
    command: python -m app.worker
    env_file: [.env]
    environment: *appenv
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_healthy}

  tests:                       # docker compose --profile test run --rm tests   (no API keys, no other services needed)
    build: .
    profiles: ["test"]
    command: python -m pytest -q tests
    environment:
      DATABASE_URL: sqlite:////tmp/test.db
      STORAGE_BACKEND: local

volumes:
  pgdata:
  miniodata:
